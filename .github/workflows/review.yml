# Self-review: on every PR, build the reviewer image from that PR's source
# and run it against the PR itself.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents:      read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `git diff base...head` and rename detection work.
          fetch-depth: 0

      - name: Build reviewer image
        run: docker build -t reviewer .

      - name: Run reviewer on this PR
        env:
          # Default GITHUB_TOKEN can POST comments but, as a GitHub App
          # (integration) token, cannot `resolveReviewThread` — so reconcile
          # can't clean up addressed bot threads ("Resource not accessible by
          # integration"). A user PAT can. Set REVIEWER_GH_TOKEN (fine-grained:
          # Pull requests = read+write) to enable thread resolution; falls back
          # to the default token (post-only) when unset.
          GITHUB_TOKEN: ${{ secrets.REVIEWER_GH_TOKEN || secrets.GITHUB_TOKEN }}
          LLM_URL:      ${{ secrets.LLM_URL }}
          LLM_KEY:      ${{ secrets.LLM_KEY }}
          LLM_MODEL:    ${{ vars.LLM_MODEL }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e GITHUB_ACTIONS \
            -e GITHUB_TOKEN \
            -e LLM_URL \
            -e LLM_KEY \
            -e LLM_MODEL \
            reviewer \
            run --pr "${{ github.event.pull_request.html_url }}"
